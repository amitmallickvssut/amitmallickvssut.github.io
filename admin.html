<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Amit Mallick</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --ink:#1b2a4a; --ink-soft:#3d4c6e; --paper:#faf7ef; --parchment:#efe7d3;
    --line:#d8cdaf; --brass:#6b7d3a; --danger:#8c2f2f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px 60px;}

  header{border-bottom:2px solid var(--ink);padding:32px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  header h1{font-family:'Fraunces',serif;font-weight:700;font-size:26px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--brass);margin-bottom:6px;}
  #userBox{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:10px;}
  button{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:8px 16px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;}
  button.secondary{background:#fff;color:var(--ink);}
  button.danger{background:var(--danger);border-color:var(--danger);}
  button:hover{opacity:.88;}

  #loginScreen{text-align:center;padding:100px 20px;}
  #loginScreen h2{font-family:'Fraunces',serif;font-size:24px;margin-bottom:12px;}
  #loginScreen p{color:var(--ink-soft);margin-bottom:24px;}
  #loginError{color:var(--danger);font-size:13px;margin-top:14px;display:none;}

  #adminPanel{display:none;}

  .section-tabbar{display:flex;gap:8px;margin:24px 0 0;flex-wrap:wrap;}
  .section-tabbtn{font-family:'Fraunces',serif;font-weight:600;font-size:14px;padding:10px 18px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;border-radius:6px 6px 0 0;}
  .section-tabbtn.active{background:var(--ink);color:#faf7ef;}
  .section-panel{display:none;border:1px solid var(--ink);border-radius:0 6px 6px 6px;padding:24px;margin-bottom:30px;}
  .section-panel.active{display:block;}

  .sub-tabbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .sub-tabbtn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:7px 12px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;border-radius:4px;}
  .sub-tabbtn.active{background:var(--brass);color:#fff;border-color:var(--brass);}
  .sub-panel{display:none;}
  .sub-panel.active{display:block;}

  .form-card{background:var(--parchment);border-radius:6px;padding:20px;margin-bottom:20px;}
  .form-card h3{font-family:'Fraunces',serif;font-size:15px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--brass);margin-bottom:4px;font-family:'JetBrains Mono',monospace;}
  .field input, .field select, .field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;}
  .field small{display:block;color:var(--ink-soft);font-size:11px;margin-top:3px;}
  .form-actions{display:flex;gap:10px;margin-top:6px;align-items:center;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--brass);border-bottom:2px solid var(--ink);padding:7px;font-family:'JetBrains Mono',monospace;}
  td{padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:top;}
  .row-actions button{padding:4px 10px;font-size:12px;margin-right:6px;}
  .empty-row td{text-align:center;color:var(--ink-soft);padding:20px;}
  .status{font-size:13px;color:var(--brass);margin-top:10px;min-height:18px;}
  .doc-link{color:var(--brass);font-size:12px;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">SITE Admin</div>
      <h1>ADMIN LOGIN</h1>
    </div>
    <div id="userBox"></div>
  </header>

  <div id="loginScreen">
    <h2>Sign in to Core</h2>
    <p>Only your authorized Admin can access this page.</p>
    <button id="googleSignInBtn">Sign in with Google</button>
    <div id="loginError"></div>
  </div>

  <div id="adminPanel">
    <div class="section-tabbar" id="sectionTabbar"></div>
    <div id="sectionPanels"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, getDocs, doc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import {
    getStorage, ref, uploadBytes, getDownloadURL
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCblc6IaKw_46cSeM6Vi0ou_rN3vBFYqB8",
    authDomain: "amitmallickvssut-github.firebaseapp.com",
    projectId: "amitmallickvssut-github",
    storageBucket: "amitmallickvssut-github.firebasestorage.app",
    messagingSenderId: "348756414208",
    appId: "1:348756414208:web:2fad1e5f4e0debfafb6de5"
  };

  const ALLOWED_EMAIL = "amitmallick_ee@vssut.ac.in";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);
  const provider = new GoogleAuthProvider();

  // ---- Data model: Section -> Subcategory -> { collection, fields, listCols } ----
  const SECTIONS = {
    research: {
      label: "Research",
      subcats: {
        publications: {
          label: "Publications", collection: "research_publications",
          fields: [
            { key: "title", label: "Title", type: "text" },
            { key: "institution", label: "Institution / Journal / Venue", type: "text" },
            { key: "period", label: "Date range / Period", type: "text", hint: "e.g. Jul 2024 – Dec 2024, or a single date" }
          ],
          listCols: ["title", "institution", "period"]
        },
        patents: {
          label: "Patent", collection: "research_patents",
          fields: [
            { key: "title", label: "Title", type: "text" },
            { key: "institution", label: "Institution / Office", type: "text" },
            { key: "period", label: "Date range / Period", type: "text" }
          ],
          listCols: ["title", "institution", "period"]
        },
        fdps: {
          label: "FDPs", collection: "research_fdps",
          fields: [
            { key: "title", label: "Title", type: "text" },
            { key: "institution", label: "Institution / Organiser", type: "text" },
            { key: "period", label: "Date range / Period", type: "text" }
          ],
          listCols: ["title", "institution", "period"]
        },
        online_courses: {
          label: "Online Courses", collection: "research_online_courses",
          fields: [
            { key: "title", label: "Course title", type: "text" },
            { key: "institution", label: "Platform / Institution", type: "text" },
            { key: "period", label: "Date range / Period", type: "text" }
          ],
          listCols: ["title", "institution", "period"]
        },
        industrial_training: {
          label: "Industrial Training", collection: "research_industrial_training",
          fields: [
            { key: "title", label: "Title", type: "text" },
            { key: "institution", label: "Institution / Company", type: "text" },
            { key: "period", label: "Date range / Period", type: "text" },
            { key: "mode", label: "Mode", type: "select", options: ["Online", "Offline"] }
          ],
          listCols: ["title", "institution", "period", "mode"]
        }
      }
    },
    duty: {
      label: "Duty",
      subcats: {
        university: {
          label: "University Duty", collection: "duty_university",
          fields: [
            { key: "title", label: "Title", type: "text" },
            { key: "period", label: "Date range / Period", type: "text" }
          ],
          listCols: ["title", "period"]
        },
        departmental: {
          label: "Departmental Duty", collection: "duty_departmental",
          fields: [
            { key: "title", label: "Title", type: "text" },
            { key: "period", label: "Date range / Period", type: "text" }
          ],
          listCols: ["title", "period"]
        }
      }
    },
    students: {
      label: "Students",
      subcats: {
        ug_project: {
          label: "UG Project", collection: "students_ug_project",
          fields: [
            { key: "thesisTitle", label: "Thesis / Project title", type: "text" },
            { key: "studentName", label: "Student name(s)", type: "text" },
            { key: "academicYear", label: "Academic year", type: "text" }
          ],
          listCols: ["thesisTitle", "studentName", "academicYear"]
        },
        pg_project: {
          label: "PG Project", collection: "students_pg_project",
          fields: [
            { key: "thesisTitle", label: "Thesis title", type: "text" },
            { key: "studentName", label: "Student name", type: "text" },
            { key: "academicYear", label: "Academic year", type: "text" }
          ],
          listCols: ["thesisTitle", "studentName", "academicYear"]
        }
      }
    },
    teaching: {
      label: "Teaching",
      subcats: {
        ug_subjects: {
          label: "UG Subjects", collection: "teaching_ug",
          fields: [
            { key: "subjectTitle", label: "Subject title", type: "text" },
            { key: "period", label: "Academic year / Period", type: "text" }
          ],
          listCols: ["subjectTitle", "period"]
        },
        pg_subjects: {
          label: "PG Subjects", collection: "teaching_pg",
          fields: [
            { key: "subjectTitle", label: "Subject title", type: "text" },
            { key: "period", label: "Academic year / Period", type: "text" }
          ],
          listCols: ["subjectTitle", "period"]
        }
      }
    },
    mentor: {
      label: "Mentor",
      subcats: {
        ug_mentor: {
          label: "UG Mentor", collection: "mentor_ug",
          fields: [
            { key: "year", label: "Year", type: "select", options: ["1", "2", "3", "4"] },
            { key: "numStudents", label: "Number of students", type: "text" },
            { key: "period", label: "Academic year / Period", type: "text" }
          ],
          listCols: ["year", "numStudents", "period"]
        },
        pg_mentor: {
          label: "PG Mentor", collection: "mentor_pg",
          fields: [
            { key: "year", label: "Year", type: "select", options: ["1", "2"] },
            { key: "numStudents", label: "Number of students", type: "text" },
            { key: "period", label: "Academic year / Period", type: "text" }
          ],
          listCols: ["year", "numStudents", "period"]
        }
      }
    }
  };

  const sectionTabbar = document.getElementById("sectionTabbar");
  const sectionPanels = document.getElementById("sectionPanels");

  function buildUI() {
    Object.keys(SECTIONS).forEach((secKey, si) => {
      const sec = SECTIONS[secKey];

      const secBtn = document.createElement("button");
      secBtn.className = "section-tabbtn" + (si === 0 ? " active" : "");
      secBtn.textContent = sec.label;
      secBtn.onclick = () => showSection(secKey);
      secBtn.dataset.section = secKey;
      sectionTabbar.appendChild(secBtn);

      const secPanel = document.createElement("div");
      secPanel.className = "section-panel" + (si === 0 ? " active" : "");
      secPanel.id = "section-" + secKey;

      const subTabbar = document.createElement("div");
      subTabbar.className = "sub-tabbar";
      secPanel.appendChild(subTabbar);

      Object.keys(sec.subcats).forEach((subKey, sj) => {
        const sub = sec.subcats[subKey];
        const fullKey = secKey + "__" + subKey;

        const subBtn = document.createElement("button");
        subBtn.className = "sub-tabbtn" + (sj === 0 ? " active" : "");
        subBtn.textContent = sub.label;
        subBtn.onclick = () => showSub(secKey, fullKey);
        subBtn.dataset.sub = fullKey;
        subTabbar.appendChild(subBtn);

        const subPanel = document.createElement("div");
        subPanel.className = "sub-panel" + (sj === 0 ? " active" : "");
        subPanel.id = "sub-" + fullKey;

        const formCard = document.createElement("div");
        formCard.className = "form-card";
        formCard.innerHTML = `<h3>Add ${sub.label} entry</h3><div id="form-${fullKey}"></div>`;
        const formDiv = formCard.querySelector(`#form-${fullKey}`);

        sub.fields.forEach(f => {
          const fieldDiv = document.createElement("div");
          fieldDiv.className = "field";
          let inputHtml;
          if (f.type === "select") {
            inputHtml = `<select id="input-${fullKey}-${f.key}">` +
              f.options.map(o => `<option value="${o}">${o}</option>`).join("") + `</select>`;
          } else {
            inputHtml = `<input type="text" id="input-${fullKey}-${f.key}">`;
          }
          fieldDiv.innerHTML = `<label>${f.label}</label>${inputHtml}` + (f.hint ? `<small>${f.hint}</small>` : "");
          formDiv.appendChild(fieldDiv);
        });

        // supporting document upload — added to every subcategory
        const fileFieldDiv = document.createElement("div");
        fileFieldDiv.className = "field";
        fileFieldDiv.innerHTML = `<label>Supporting document (optional)</label><input type="file" id="file-${fullKey}">`;
        formDiv.appendChild(fileFieldDiv);

        const actionsDiv = document.createElement("div");
        actionsDiv.className = "form-actions";
        actionsDiv.innerHTML = `<button onclick="window.saveEntry('${secKey}','${subKey}')">Save entry</button>
          <span class="status" id="status-${fullKey}"></span>`;
        formCard.appendChild(actionsDiv);

        subPanel.appendChild(formCard);

        const tableWrap = document.createElement("div");
        tableWrap.innerHTML = `
          <table>
            <thead><tr>${sub.listCols.map(c => `<th>${c}</th>`).join("")}<th>Doc</th><th></th></tr></thead>
            <tbody id="rows-${fullKey}"><tr class="empty-row"><td colspan="${sub.listCols.length + 2}">Loading…</td></tr></tbody>
          </table>`;
        subPanel.appendChild(tableWrap);

        secPanel.appendChild(subPanel);
      });

      sectionPanels.appendChild(secPanel);
    });
  }

  window.showSection = function(secKey) {
    document.querySelectorAll(".section-tabbtn").forEach(b => b.classList.toggle("active", b.dataset.section === secKey));
    document.querySelectorAll(".section-panel").forEach(p => p.classList.toggle("active", p.id === "section-" + secKey));
  };

  window.showSub = function(secKey, fullKey) {
    const secPanel = document.getElementById("section-" + secKey);
    secPanel.querySelectorAll(".sub-tabbtn").forEach(b => b.classList.toggle("active", b.dataset.sub === fullKey));
    secPanel.querySelectorAll(".sub-panel").forEach(p => p.classList.toggle("active", p.id === "sub-" + fullKey));
  };

  window.saveEntry = async function(secKey, subKey) {
    const sub = SECTIONS[secKey].subcats[subKey];
    const fullKey = secKey + "__" + subKey;
    const data = {};
    sub.fields.forEach(f => {
      data[f.key] = document.getElementById(`input-${fullKey}-${f.key}`).value.trim();
    });
    if (!data[sub.fields[0].key]) {
      document.getElementById(`status-${fullKey}`).textContent = "Please fill in the first field at least.";
      return;
    }
    const statusEl = document.getElementById(`status-${fullKey}`);
    const fileInput = document.getElementById(`file-${fullKey}`);
    const file = fileInput.files[0];

    try {
      if (file) {
        statusEl.textContent = "Uploading document…";
        const path = `${sub.collection}/${Date.now()}_${file.name}`;
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, file);
        data.fileURL = await getDownloadURL(storageRef);
        data.fileName = file.name;
      }
      await addDoc(collection(db, sub.collection), data);
      sub.fields.forEach(f => {
        document.getElementById(`input-${fullKey}-${f.key}`).value = "";
      });
      fileInput.value = "";
      statusEl.textContent = "Saved.";
      loadEntries(secKey, subKey);
      setTimeout(() => { statusEl.textContent = ""; }, 2500);
    } catch (e) {
      statusEl.textContent = "Error: " + e.message;
    }
  };

  window.deleteEntry = async function(collectionName, id, secKey, subKey) {
    if (!confirm("Delete this entry?")) return;
    try {
      await deleteDoc(doc(db, collectionName, id));
      loadEntries(secKey, subKey);
    } catch (e) {
      alert("Delete failed: " + e.message);
    }
  };

  async function loadEntries(secKey, subKey) {
    const sub = SECTIONS[secKey].subcats[subKey];
    const fullKey = secKey + "__" + subKey;
    const tbody = document.getElementById(`rows-${fullKey}`);
    try {
      const snap = await getDocs(collection(db, sub.collection));
      if (snap.empty) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="${sub.listCols.length + 2}">No entries yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = "";
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const tr = document.createElement("tr");
        const docCell = d.fileURL
          ? `<a class="doc-link" href="${d.fileURL}" target="_blank" rel="noopener">${d.fileName || "View"}</a>`
          : "—";
        tr.innerHTML = sub.listCols.map(c => `<td>${(d[c] || "").toString().slice(0,120)}</td>`).join("") +
          `<td>${docCell}</td>` +
          `<td class="row-actions"><button class="danger" onclick="window.deleteEntry('${sub.collection}','${docSnap.id}','${secKey}','${subKey}')">Delete</button></td>`;
        tbody.appendChild(tr);
      });
    } catch (e) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="${sub.listCols.length + 2}">Could not load: ${e.message}</td></tr>`;
    }
  }

  function loadAllEntries() {
    Object.keys(SECTIONS).forEach(secKey => {
      Object.keys(SECTIONS[secKey].subcats).forEach(subKey => loadEntries(secKey, subKey));
    });
  }

  document.getElementById("googleSignInBtn").addEventListener("click", async () => {
    document.getElementById("loginError").style.display = "none";
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      document.getElementById("loginError").textContent = "Sign-in failed: " + e.message;
      document.getElementById("loginError").style.display = "block";
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === ALLOWED_EMAIL) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      document.getElementById("userBox").innerHTML =
        `Signed in as ${user.email} <button class="secondary" id="signOutBtn">Sign out</button>`;
      document.getElementById("signOutBtn").onclick = () => signOut(auth);
      loadAllEntries();
    } else if (user && user.email !== ALLOWED_EMAIL) {
      document.getElementById("loginError").textContent = `This page is restricted. Signed-in account (${user.email}) is not authorized.`;
      document.getElementById("loginError").style.display = "block";
      signOut(auth);
    } else {
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("adminPanel").style.display = "none";
      document.getElementById("userBox").innerHTML = "";
    }
  });

  buildUI();
</script>

</body>
</html>
